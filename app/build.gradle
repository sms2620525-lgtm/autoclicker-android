plugins { id 'com.android.application' }

android {
    namespace 'dev.tapbench.autoclicker'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.tapbench.autoclicker'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'dev.tapbench.autoclicker.BenchInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
