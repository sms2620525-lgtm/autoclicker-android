name: Android APK and real touch test

on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', '*.gradle', 'gradle.properties', 'settings.gradle']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and installable APKs
        id: build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TapBench-1.0.0-debug.apk
          cd dist
          sha256sum TapBench-1.0.0-debug.apk > SHA256SUMS.txt
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android touch benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/device-test.sh
      - name: Package test and performance reports
        if: always() && steps.build.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('dist/TapBench-test-results.zip', 'w', ZIP_DEFLATED) as archive:
              for root in ('app/build/reports', 'app/build/test-results', 'device-results'):
                  for path in sorted(Path(root).rglob('*')):
                      if path.is_file():
                          archive.write(path, str(path))
          PY
      - name: Publish downloadable test APK and reports
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: test-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "TapBench 테스트 APK #${GITHUB_RUN_NUMBER}" \
            --notes-file scripts/release-notes.md \
            --prerelease
